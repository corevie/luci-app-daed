<%+header%>
<%
	local running = luci.sys.call("pidof daed >/dev/null") == 0
%>
<% if running then %>
	<div class="cbi-map">
		<div id="daed-loading" class="daed-state" role="status"><%:Connecting to the DAED dashboard…%></div>
		<iframe id="daed" class="daed-iframe" style="display:none"></iframe>
		<div id="daed-error" class="daed-state daed-error" style="display:none"></div>
	</div>
	<style>
	.daed-iframe {
		width: 100%;
		height: calc(100vh - 130px);
		min-height: 480px;
		border: none;
		display: block;
	}
	.daed-state { text-align: center; padding: 60px 20px; color: #888; }
	.daed-error { color: #b00020; }
	@media (prefers-color-scheme: dark) { .daed-error { color: #ff8a80; } }
	</style>
	<script type="text/javascript">
		var listenAddr = "<%=luci.model.uci.cursor():get_first("daed", "daed", "listen_addr") or ''%>";
		var dashboardPort = "<%=luci.model.uci.cursor():get_first("daed", "daed", "dashboard_port") or ''%>";

		var port = "";
		if (dashboardPort && dashboardPort.trim() !== "") {
			port = dashboardPort.trim();
		} else {
			var portRegex = /:(\d+)/;
			var match = listenAddr.match(portRegex);
			if (match && match[1]) {
				port = match[1];
			}
		}

		var loading = document.getElementById("daed-loading");
		var errorBox = document.getElementById("daed-error");
		var iframe = document.getElementById("daed");

		function showError(msg) {
			loading.style.display = "none";
			iframe.style.display = "none";
			errorBox.style.display = "block";
			errorBox.textContent = msg;
		}

		if (!port) {
			showError("<%:Cannot determine the dashboard port. Set Dashboard Access Port in Base Setting.%>");
		} else {
			var protocol = window.location.protocol;
			var hostname = window.location.hostname;
			var url = protocol + "//" + hostname;
			if (!((protocol === "http:" && port === "80") || (protocol === "https:" && port === "443"))) {
				url += ":" + port;
			}
			iframe.onload = function() {
				loading.style.display = "none";
				errorBox.style.display = "none";
				iframe.style.display = "block";
				iframe.setAttribute("data-loaded", "1");
			};
			setTimeout(function() {
				if (iframe.getAttribute("data-loaded") !== "1") {
					showError("<%:Cannot reach the DAED dashboard.%> " + url + " <%:Check that the daemon is running and listens on this port.%>");
				}
			}, 10000);
			iframe.src = url;
		}
	</script>
<% else %>
	<style>
	.notrunning { text-align: center; padding: 60px 20px; }
	.notrunning svg { width: 90px; height: 90px; opacity: .8; }
	.notrunning h1 { font-size: 25px; color: #333; margin: 16px 0; }
	.notrunning p { font-size: 18px; color: #666; margin-bottom: 24px; }
	@media (prefers-color-scheme: dark) {
		.notrunning h1 { color: #ccc; }
		.notrunning p { color: #aaa; }
	}
	</style>
	<div class="notrunning">
		<svg viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
			<circle cx="12" cy="12" r="10"/>
			<line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
		</svg>
		<h1><%:DAED is not running%></h1>
		<p><%:Please start the DAED service first and try again%></p>
	</div>
<% end -%>

<%+footer%>
